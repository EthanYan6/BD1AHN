<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="chassis" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#404040"/>
      <stop offset="40%" stop-color="#282828"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="chassisEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="50%" stop-color="#383838"/>
      <stop offset="100%" stop-color="#1e1e1e"/>
    </linearGradient>
    <linearGradient id="antenna" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#5c5c5c"/>
    </linearGradient>
    <linearGradient id="keyTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#2e2e2e"/>
    </linearGradient>
    <linearGradient id="pttRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e05545"/>
      <stop offset="100%" stop-color="#922018"/>
    </linearGradient>
    <filter id="deviceShadow" x="-15%" y="-5%" width="130%" height="115%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <ellipse cx="150" cy="548" rx="100" ry="10" fill="#000" opacity="0.28"/>

  <g filter="url(#deviceShadow)">
    <!-- antenna -->
    <path fill="url(#antenna)" d="M 208 68 L 208 34 C 208 28 232 28 232 34 L 232 68 Z"/>

    <!-- chassis with wide transparent screen hole -->
    <path fill="url(#chassis)" fill-rule="evenodd" stroke="url(#chassisEdge)" stroke-width="1" d="
      M 54 68
      H 246
      a 24 24 0 0 1 24 24
      V 514
      a 24 24 0 0 1 -24 24
      H 54
      a 24 24 0 0 1 -24 -24
      V 92
      a 24 24 0 0 1 24 -24
      Z
      M 42 118
      H 258
      V 242
      H 42
      Z
    "/>

    <!-- top knob -->
    <rect x="58" y="80" width="34" height="14" rx="4" fill="#2e2e2e" stroke="#454545" stroke-width="0.6"/>
    <rect x="64" y="84" width="22" height="3" rx="1.5" fill="#555"/>

    <!-- screen bezel -->
    <rect x="36" y="114" width="228" height="132" rx="4" fill="none" stroke="#3e3e3e" stroke-width="2.5"/>
    <rect x="40" y="118" width="220" height="124" rx="2" fill="none" stroke="#222" stroke-width="0.8"/>

    <!-- speaker -->
    <rect x="118" y="258" width="64" height="2.5" rx="1.25" fill="#2a2a2a"/>
    <rect x="108" y="264" width="84" height="1.5" rx="0.75" fill="#222"/>

    <!-- keypad -->
    <rect x="36" y="276" width="228" height="148" rx="7" fill="#181818" stroke="#2a2a2a" stroke-width="0.7"/>

    <g font-family="Arial" font-size="11" fill="#aaa" text-anchor="middle">
      <circle cx="86" cy="310" r="16" fill="url(#keyTop)" stroke="#4a4a4a" stroke-width="0.7"/><text x="86" y="314">1</text>
      <circle cx="150" cy="310" r="16" fill="url(#keyTop)" stroke="#4a4a4a" stroke-width="0.7"/><text x="150" y="314">2</text>
      <circle cx="214" cy="310" r="16" fill="url(#keyTop)" stroke="#4a4a4a" stroke-width="0.7"/><text x="214" y="314">3</text>
      <circle cx="86" cy="352" r="16" fill="url(#keyTop)" stroke="#4a4a4a" stroke-width="0.7"/><text x="86" y="356">4</text>
      <circle cx="150" cy="352" r="16" fill="url(#keyTop)" stroke="#4a4a4a" stroke-width="0.7"/><text x="150" y="356">5</text>
      <circle cx="214" cy="352" r="16" fill="url(#keyTop)" stroke="#4a4a4a" stroke-width="0.7"/><text x="214" y="356">6</text>
      <circle cx="86" cy="394" r="16" fill="url(#keyTop)" stroke="#4a4a4a" stroke-width="0.7"/><text x="86" y="398">7</text>
      <circle cx="150" cy="394" r="16" fill="url(#keyTop)" stroke="#4a4a4a" stroke-width="0.7"/><text x="150" y="398">8</text>
      <circle cx="214" cy="394" r="16" fill="url(#keyTop)" stroke="#4a4a4a" stroke-width="0.7"/><text x="214" y="398">9</text>
    </g>

    <!-- PTT -->
    <circle cx="150" cy="466" r="32" fill="url(#pttRed)" stroke="#701810" stroke-width="1.5"/>
    <circle cx="150" cy="466" r="24" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.8"/>
    <text x="150" y="470" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7" font-family="Arial" letter-spacing="0.8">PTT</text>

    <rect x="258" y="324" width="5" height="38" rx="2.5" fill="#252525" stroke="#383838" stroke-width="0.4"/>
  </g>
</svg>
