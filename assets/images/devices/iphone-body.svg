<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a6a6e"/>
      <stop offset="12%" stop-color="#4e4e52"/>
      <stop offset="50%" stop-color="#2c2c30"/>
      <stop offset="88%" stop-color="#1a1a1e"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>
    <linearGradient id="edgeHi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#777"/>
      <stop offset="50%" stop-color="#444"/>
      <stop offset="100%" stop-color="#777"/>
    </linearGradient>
    <linearGradient id="glare" x1="0%" y1="0%" x2="80%" y2="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="phoneShadow" x="-6%" y="-12%" width="112%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <clipPath id="bounds"><rect width="800" height="380"/></clipPath>
  </defs>

  <ellipse cx="400" cy="368" rx="280" ry="12" fill="#000" opacity="0.25"/>

  <g clip-path="url(#bounds)" filter="url(#phoneShadow)">
    <!-- bezel ring only — screen hole is transparent -->
    <path fill="url(#titanium)" fill-rule="evenodd" stroke="url(#edgeHi)" stroke-width="1.2" d="
      M 68 24
      h 664
      a 44 44 0 0 1 44 44
      v 244
      a 44 44 0 0 1 -44 44
      H 68
      a 44 44 0 0 1 -44 -44
      V 68
      a 44 44 0 0 1 44 -44
      z
      M 84 52
      h 632
      a 28 28 0 0 1 28 28
      v 220
      a 28 28 0 0 1 -28 28
      H 84
      a 28 28 0 0 1 -28 -28
      V 80
      a 28 28 0 0 1 28 -28
      z
    "/>

    <!-- top chamfer light -->
    <rect x="40" y="26" width="720" height="1.5" rx="0.75" fill="rgba(255,255,255,0.16)"/>

    <!-- inner screen lip -->
    <rect x="52" y="48" width="696" height="284" rx="30" fill="none" stroke="#222" stroke-width="1.5"/>

    <!-- glass glare on bezel only -->
    <path fill="url(#glare)" fill-rule="evenodd" opacity="0.45" d="
      M 68 24 h 664 a 44 44 0 0 1 44 44 v 244 a 44 44 0 0 1 -44 44 H 68 a 44 44 0 0 1 -44 -44 V 68 a 44 44 0 0 1 44 -44 z
      M 84 52 h 632 a 28 28 0 0 1 28 28 v 220 a 28 28 0 0 1 -28 28 H 84 a 28 28 0 0 1 -28 -28 V 80 a 28 28 0 0 1 28 -28 z
    "/>

    <!-- camera (left bezel) -->
    <circle cx="62" cy="190" r="7" fill="#0c0c0c" stroke="#333" stroke-width="1"/>
    <circle cx="62" cy="190" r="3" fill="#1a2540"/>
    <circle cx="60.5" cy="188.5" r="1" fill="rgba(80,120,180,0.35)"/>

    <!-- speaker holes (right bezel) -->
    <g fill="#2a2a2a">
      <circle cx="738" cy="178" r="1.3"/>
      <circle cx="738" cy="184" r="1.3"/>
      <circle cx="738" cy="190" r="1.3"/>
      <circle cx="738" cy="196" r="1.3"/>
      <circle cx="738" cy="202" r="1.3"/>
    </g>
  </g>
</svg>
